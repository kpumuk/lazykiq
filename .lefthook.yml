pre-push:
  jobs:
    - name: packages audit
      tags:
        - security
      run: mise exec golang -- go tool golang.org/x/vuln/cmd/govulncheck ./...

    - name: gems audit
      tags:
        - security
      run: |
        status=0
        for lockfile in Gemfile.lock bundles/sidekiq-*/Gemfile.lock; do
          mise exec ruby -- bundle audit --gemfile-lock "$lockfile" || status=1
        done
        exit "$status"
      root: "demo/"

pre-commit:
  parallel: true
  fail_on_changes: "always"
  jobs:
    - name: lint
      glob:
        - ".golangci.yml"
        - "*.go"
      run: mise run lint --fix

    - name: rubocop
      glob:
        - "demo/**/*.rb"
        - "demo/Gemfile*"
        - "demo/bundles/**/Gemfile"
      run: mise exec ruby -- bundle exec standardrb --fix
      root: "demo/"
